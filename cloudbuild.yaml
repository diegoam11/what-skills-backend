steps:
  # 1. Construir
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/ar-api-whatskills-dev/api-whatskills-dev:$COMMIT_SHA', '-f', 'Dockerfile', '.']

  # 2. Subir
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/ar-api-whatskills-dev/api-whatskills-dev:$COMMIT_SHA']

  # 3. Desplegar
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'api-whatskills-dev'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ar-api-whatskills-dev/api-whatskills-dev:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      
      # --- CORRECCIÓN: Todo en una sola línea separada por comas ---
      - '--set-env-vars'
      - 'ENVIRONMENT=production,PROJECT_NAME=What_Skills_API,API_V1_STR=/api/v1,ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=30,EMBEDDING_MODEL_NAME=intfloat/multilingual-e5-base,DB_USER=whatskills-app-user,DB_NAME=whatskills_db,INSTANCE_CONNECTION_NAME=advance-engine-480221-i0:us-central1:inst-postgresql-dev'
      
      # --- CORRECCIÓN: Secretos también en una sola línea ---
      - '--set-secrets'
      - 'DB_PASSWORD=db-password-whatskills-dev:latest,SECRET_KEY=whatskills-secret-key:latest,GEMINI_API_KEY=gemini-api-key:latest'

      # Conexión DB
      - '--add-cloudsql-instances'
      - 'advance-engine-480221-i0:us-central1:inst-postgresql-dev'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ar-api-whatskills-dev/api-whatskills-dev:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY